<style>
/* Plan: soft daylight world, misty mint ground with white cards, one accent that changes with the avatar's form.
   Layout: phone app, five tabs (Home, Today, Insights, Journey, Me) with a floating tab bar. */
:root{
  --bg:#eef5f3; --panel:#ffffff; --panel2:#f0f6f5; --line:#d9e6e3;
  --text:#1c2b2f; --mute:#5f767b; --accent:#e08a2e; --good:#2f9e77; --bad:#d9604f;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center}
body.lock{overflow:hidden}
#shell{width:100%;max-width:460px;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px calc(86px + env(safe-area-inset-bottom))}
#screen{display:flex;flex-direction:column;gap:14px;animation:enter .38s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-family:var(--display);font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--display);font-weight:800;font-size:22px}
.chip{font-size:13px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--panel2);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(30,70,70,.05),0 10px 28px rgba(30,70,70,.06)}
.hero{position:relative;overflow:hidden;align-items:center;text-align:center;gap:6px;padding:12px 16px 18px;background:radial-gradient(110% 80% at 50% 30%,color-mix(in srgb,var(--accent) 20%,#fff) 0%,#fff 74%)}
.parts{position:absolute;inset:0;pointer-events:none}
.parts i{position:absolute;bottom:-10px;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:0;animation:rise var(--d) linear var(--w) infinite}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:.8}100%{transform:translateY(-330px) scale(.3);opacity:0}}
.avatar{position:relative;width:min(74%,250px);animation:float 4.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.avatar svg{width:100%;height:auto;display:block;overflow:visible}
.aura{transform-origin:100px 118px;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1) rotate(0);opacity:.8}50%{transform:scale(1.06) rotate(3deg);opacity:1}}
.form{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.days{font-family:var(--display);font-weight:800;font-size:68px;line-height:1;font-variant-numeric:tabular-nums}
.days small{font-size:17px;font-weight:500;color:var(--mute);margin-left:6px}
.sub{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.bar{width:100%;height:10px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.barlbl{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer;border:0;border-radius:16px;padding:14px 16px;min-height:50px;background:var(--panel2);font-weight:600;transition:transform .12s,filter .12s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:#17100a;font-family:var(--display);font-weight:800;font-size:19px;min-height:62px;animation:glow 2.6s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 25%,transparent)}50%{box-shadow:0 10px 32px color-mix(in srgb,var(--accent) 50%,transparent)}}
.small{min-height:44px;font-size:15px;padding:10px 14px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mute)}
.row{display:flex;gap:10px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.quest{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel2);font-weight:600}
.box{width:26px;height:26px;border-radius:9px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:15px;color:#10170f;transition:all .25s}
.on .box{background:var(--good);border-color:var(--good);transform:scale(1.1)}
.on{opacity:.85}
.xp{margin-left:auto;font-size:13px;color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{aspect-ratio:1;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.cell.clean{background:color-mix(in srgb,var(--good) 42%,var(--panel2));color:var(--text)}
.cell.slip{background:color-mix(in srgb,var(--bad) 48%,var(--panel2));color:var(--text)}
.cell.today{outline:2px solid var(--accent)}
.dow{font-size:11px;text-align:center;color:var(--mute)}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border-radius:14px;padding:12px;transition:opacity .3s}
.item.locked{opacity:.45}
.when{font-family:var(--display);font-weight:800;color:var(--accent);min-width:62px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--mute);margin-top:4px}
.tag.ev{background:color-mix(in srgb,var(--good) 25%,var(--panel));color:var(--good)}
.note{font-size:14px;color:var(--mute)}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{background:var(--panel2);border-radius:14px;padding:12px;font-size:13px;opacity:.4;display:flex;flex-direction:column;gap:2px}
.badge.got{opacity:1;box-shadow:inset 0 0 0 1.5px var(--accent)}
.badge b{font-size:14px}
.reason{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:14px;padding:10px 12px}
.reason button{margin-left:auto;padding:4px 10px;min-height:36px;background:transparent;color:var(--mute)}
input[type=text],input[type=number],textarea{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%;min-height:50px}
textarea{resize:vertical;min-height:90px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{min-height:40px;padding:8px 14px;border-radius:99px;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.chipb.sel{background:var(--accent);color:#17100a;border-color:var(--accent)}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.moods button{padding:10px 0;min-height:48px;font-family:var(--display);font-size:18px;font-weight:800}
.moods button.sel{background:var(--accent);color:#17100a}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--mute)}
.bars i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:var(--accent);min-height:3px;transition:height .7s cubic-bezier(.2,.8,.2,1)}
.bars i.zero{background:var(--panel2)}
.warn{background:color-mix(in srgb,var(--bad) 16%,var(--panel));border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);transform:translateZ(0)}
nav .bar2{width:100%;max-width:460px;margin:0 auto;display:flex}
nav button{flex:1;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute);padding:9px 0 8px;min-height:58px;border-radius:0;position:relative;transition:none}
nav button:active{transform:none}
nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.act{color:var(--text);font-weight:700}
nav button.act::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--accent)}
#overlay,#dialog{position:fixed;inset:0;display:none;z-index:10}
#overlay.show,#dialog.show{display:flex}
#overlay{background:linear-gradient(180deg,#eef5f3,#e3efec);flex-direction:column;align-items:center;justify-content:flex-start;gap:16px;padding:24px;text-align:center;animation:enter .3s;overflow:auto}
#dialog{background:rgba(28,43,47,.5);align-items:center;justify-content:center;padding:20px;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--panel);box-shadow:0 20px 60px rgba(30,70,70,.2);border:1px solid var(--line);border-radius:22px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;animation:pop .35s cubic-bezier(.2,1.2,.3,1)}
.sheet .chips{justify-content:center}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-size:24px}
.sheet .avatar{margin:0 auto;width:60%}
.breath{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--accent),color-mix(in srgb,var(--accent) 25%,transparent));animation:breathe 14s ease-in-out infinite}
@keyframes breathe{0%{transform:scale(.55)}29%{transform:scale(1)}57%{transform:scale(1)}100%{transform:scale(.55)}}
.timer{font-family:var(--display);font-size:54px;font-weight:800;font-variant-numeric:tabular-nums}
.prompt{font-size:20px;min-height:3.6em;max-width:20em}
.prompt.long{font-size:16px;line-height:1.5;max-width:24em}
#overlay>*{flex-shrink:0}
#overlay::before,#overlay::after{content:"";margin:auto}
.toast{position:fixed;left:50%;top:max(70px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--accent);color:#17100a;font-family:var(--display);font-weight:800;padding:10px 18px;border-radius:99px;z-index:20;animation:toast 1.6s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="shell"><div id="screen"></div></div>
<nav><div class="bar2" id="tabs"></div></nav>

<script id="seed" type="application/json">null</script>
<script>
(function(){
var DAY=86400000, LS='ascend-v2';
var TAB_IDS=['home','today','insights','journey','me'];
var FORMS=[
  {min:0, name:'Dormant', color:'#7d8b9c'},
  {min:1, name:'Spark', color:'#e08a2e'},
  {min:3, name:'Ember', color:'#e5642c'},
  {min:7, name:'Surge', color:'#e0a712'},
  {min:14,name:'Blaze', color:'#17a898'},
  {min:30,name:'Stormbound', color:'#2f80e0'},
  {min:60,name:'Radiant', color:'#8b5ce0'},
  {min:90,name:'Ascendant', color:'#c9992f'}
];
var TOOLS=['Stand up and leave the room.','Splash cold water on your face.','Do 20 push-ups right now.','Text someone: rough night, can you talk?','Put the phone in another room.','Walk outside for ten minutes.','The urge peaks and fades. Ride it out.'];
var QUESTS=[{id:'checkin',t:'Check in for today',xp:10},{id:'move',t:'Move your body for 10 minutes',xp:20},{id:'bed',t:'Phone charges outside the bedroom',xp:20},{id:'water',t:'Cold water on your face or a cold shower',xp:15}];
var TRIGGERS=['Bored','Stressed','Lonely','Tired','Late night','Social media','Anxious','Other'];
var BLOCKS=['12-4am','4-8am','8am-12','12-4pm','4-8pm','8pm-12'];
var BENEFITS=[
 [1,'Streak begun','Every run starts at day one. You are already practising urge control.','Reported'],
 [3,'Urges start to fade','Many people find cravings peak in the first days, then ease.','Reported'],
 [3,'Mental clarity','Communities say the brain fog lifts and thoughts feel sharper.','Unproven claim'],
 [7,'Short testosterone bump','One small study saw testosterone rise around day 7 of abstinence, then return to baseline. Temporary.','Evidence'],
 [7,'Confidence and presence','Often repeated: calmer around people, easier eye contact.','Unproven claim'],
 [14,'Steadier sleep and focus','Fewer late-night sessions often means better sleep and attention.','Reported'],
 [14,'Deeper voice, brighter eyes','A popular forum claim. No good studies back it.','Unproven claim'],
 [21,'Magnetism and charisma','People say others treat them differently. Likely confidence, not a physical effect.','Unproven claim'],
 [30,'Habit loop weakening','Triggers lose some grip. You get back the hours the habit used to take.','Reported'],
 [45,'Vivid dreams and intuition','Commonly told anecdotally. Not shown in research.','Unproven claim'],
 [60,'Energy transmutation','The idea that saved energy turns into drive, creativity and ambition.','Folk belief'],
 [60,'Drive for real goals','More motivation for work, training and people is commonly reported.','Reported'],
 [90,'The 90-day milestone','A popular benchmark. New routines feel normal. Not a clinical cutoff.','Community milestone'],
 [90,'Ojas and jing','Yogic and Taoist traditions describe conserved vital energy as a source of strength and spiritual growth.','Spiritual tradition'],
 [180,'Higher-self awareness','Some traditions describe deeper stillness and purpose after long practice.','Spiritual tradition']
];
var BADGES=[
 ['First day','Reach day 1',function(c){return c.top>=1}],
 ['Week warrior','7 days in a row',function(c){return c.top>=7}],
 ['Two weeks','14 days in a row',function(c){return c.top>=14}],
 ['Thirty strong','30 days in a row',function(c){return c.top>=30}],
 ['Ninety','90 days in a row',function(c){return c.top>=90}],
 ['Urge surfer','Beat 5 urges',function(c){return c.s.urges>=5}],
 ['Storm rider','Beat 25 urges',function(c){return c.s.urges>=25}],
 ['Self-aware','Log 7 check-ins',function(c){return Object.keys(c.s.moods).length>=7}],
 ['Rebound','Restart after a slip',function(c){return c.s.runs.length>0&&c.s.start!=null}]
];
var TABS=[
 ['home','Home','<path d="M3 11l9-8 9 8M5 10v10h14V10"/>'],
 ['today','Today','<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'],
 ['insights','Insights','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
 ['journey','Journey','<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>'],
 ['me','Me','<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.500 3.500-7 8-7s8 2.500 8 7"/>']
];

var state, tab='home', animatedDays=false, draft=null;
function blank(){return {start:null,runs:[],slips:[],urges:0,urgeLog:[],moods:{},quests:{},reasons:['I want my time and focus back.','I want to respect myself.'],letter:'',contact:'',rewards:[],hoursPerDay:1,best:0,maxForm:-1,updated:0}}
function load(){
  var seed=null,loc=null;
  try{seed=JSON.parse(document.getElementById('seed').textContent)}catch(e){}
  try{loc=JSON.parse(localStorage.getItem(LS))}catch(e){}
  var pick=(loc&&(!seed||(loc.updated||0)>=(seed.updated||0)))?loc:seed;
  state=Object.assign(blank(),pick||{});
  var h=(location.hash||'').replace('#','');
  if(TAB_IDS.indexOf(h)>=0)tab=h;
}
var artifactNS=null,pubTimer=null,overlayOpen=false;
try{ if(window.claude&&claude.use){ claude.use('artifact').then(function(a){artifactNS=a}).catch(function(){}) } }catch(e){}
function save(){state.updated=Date.now();try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}schedulePublish()}
function schedulePublish(){
  if(!artifactNS)return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(function(){
    if(overlayOpen||el('dialog').classList.contains('show')){schedulePublish();return}
    try{
      var root=document.documentElement.cloneNode(true);

  else if(a==='dtrig'){grabDraft();var ix=draft.trigs.indexOf(id);if(ix>=0)draft.trigs.splice(ix,1);else draft.trigs.push(id);render()}
  else if(a==='savecheckin'){grabDraft();var had=!!state.moods[draft.k];state.moods[draft.k]={m:draft.m,trigs:draft.trigs.slice(),note:draft.note.slice(0,300)};setQuest('checkin',true);save();render();toast(had?'Check-in updated':'+10 XP · checked in')}
  else if(a==='addreason'){var v=el('newreason').value.trim();if(v){state.reasons.push(v.slice(0,120));save();render()}}
  else if(a==='delreason'){state.reasons.splice(parseInt(b.getAttribute('data-i'),10),1);save();render()}
  else if(a==='saveletter'){state.letter=el('letter').value.trim().slice(0,600);save();toast('Letter saved')}
  else if(a==='savecontact'){state.contact=el('contact').value.trim().slice(0,80);save();toast('Saved')}
  else if(a==='addreward'){var dd=parseInt(el('rday').value,10),tx=el('rtext').value.trim();if(dd>0&&tx){state.rewards.push({day:dd,text:tx.slice(0,60)});save();render();toast('Reward added')}}
  else if(a==='delreward'){var p=id.split('|');state.rewards=state.rewards.filter(function(r){return !(String(r.day)===p[0]&&esc(r.text)===p.slice(1).join('|'))});save();render()}
  else if(a==='copybackup'){
    var bt=el('backup');bt.select();
    try{navigator.clipboard.writeText(bt.value).then(function(){toast('Backup copied')}).catch(function(){toast('Select and copy the text')})}catch(err){toast('Select and copy the text')}
  }
  else if(a==='restore'){
    try{var o=JSON.parse(el('restore').value);if(o&&typeof o==='object'&&Array.isArray(o.reasons)){state=Object.assign(blank(),o);animatedDays=false;save();render();toast('Restored')}else{toast('That is not a valid backup')}}catch(err){toast('That is not a valid backup')}
  }
  else if(a==='slip'){dialog('<h3>Restart your streak?</h3><p class="note">A slip does not erase what you built. Your best streak of '+bestDays()+' days and your XP stay. You start a fresh run right now.</p><div class="row"><button class="ghost" data-act="closedlg">Cancel</button><button class="primary" data-act="confirmslip" style="font-size:16px">Restart</button></div>')}
  else if(a==='confirmslip'){state.best=Math.max(state.best||0,curDays());state.runs.push({s:state.start,e:now()});state.slips.push(now());state.start=now();animatedDays=false;save();closeDialog();render();dialog('<h3>New run started</h3><p class="note">One slip is data, not a verdict. Check your Insights tab to see what led to it, then begin again.</p><button class="primary" data-act="closedlg">Continue</button>')}
  else if(a==='closedlg'){closeDialog()}
});
document.addEventListener('change',function(e){
  if(e.target&&e.target.id==='hpd'){var v=parseFloat(e.target.value);state.hoursPerDay=isNaN(v)?0:Math.max(0,Math.min(12,v));save();render()}
});
window.addEventListener('hashchange',function(){var h=(location.hash||'').replace('#','');if(TAB_IDS.indexOf(h)>=0&&h!==tab){grabDraft();tab=h;render();toTop()}});

load();render();
})();
</script>
</body>
</html>
