<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#06050b"><title>Dawnblade</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;margin:0}
#stageC,#pad,#stick,#acts,.ab,#fight{touch-action:none}
html,body{height:100%;background:#06050b;color:#efe8f8;font-family:"Iowan Old Style",Georgia,serif;overflow:hidden;overscroll-behavior:none}
:root{--g:#e0b457;--g2:#8a6a20;--v:#8b6cff;--c:#2ee3c2;--r:#ff4d6d;--pn:#120e24;--ln:#3a2f6e}
canvas{display:block}
#stageC{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scr{position:fixed;inset:0;display:none;z-index:2;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.scr.on{display:flex}
.list::-webkit-scrollbar,.body::-webkit-scrollbar,#cOut::-webkit-scrollbar{width:7px}
.list::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb,#cOut::-webkit-scrollbar-thumb{background:#4a3f8a;border-radius:4px}
.list::-webkit-scrollbar-thumb:active,.body::-webkit-scrollbar-thumb:active{background:var(--g)}
.list::-webkit-scrollbar-track,.body::-webkit-scrollbar-track,#cOut::-webkit-scrollbar-track{background:#ffffff08}
.list,.body,#cOut{scroll-padding:12px}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 180px 40px #000c}
/* ---- buttons ---- */
.btn{font-family:inherit;color:#f2ecff;background:linear-gradient(180deg,#241c46,#140f2c);border:1px solid var(--ln);border-radius:4px;padding:10px 18px;font-size:15px;letter-spacing:.08em;position:relative}
.btn:active{transform:translateY(1px);filter:brightness(1.35)}
.btn.gold{background:linear-gradient(180deg,#f0d085,#b8872c 55%,#8a6a20);color:#1b1304;border-color:#ffe6a8;font-weight:700;text-shadow:0 1px 0 #ffeec0}
.btn.cy{border-color:var(--c);color:var(--c)}.btn.sel{border-color:var(--g);color:var(--g)}
.btn[disabled]{opacity:.35}
h1,h2,h3{font-weight:400;letter-spacing:.2em;margin:0}
/* ---- title ---- */
#title{flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
#title h1{font-size:clamp(40px,13vh,86px);letter-spacing:.22em;background:linear-gradient(180deg,#fff6d8,#e0b457 55%,#6b4a9e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 24px rgba(224,180,87,.35))}
#title .rule{width:min(62vw,520px);height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent);opacity:.7}
#title .sub{opacity:.55;font-size:clamp(10px,2.4vh,14px);letter-spacing:.42em}
/* ---- story ---- */
#scene{flex-direction:column;justify-content:flex-end;padding-bottom:max(10px,env(safe-area-inset-bottom))}
#dlg{margin:0 6% 0;background:linear-gradient(180deg,rgba(10,8,22,.55),rgba(8,6,18,.93));border-top:1px solid #6b5aa855;padding:14px 20px 12px;min-height:34vh;display:flex;flex-direction:column;gap:7px;position:relative}
#dlg:before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--g),transparent)}
#who{color:var(--g);letter-spacing:.3em;font-size:clamp(10px,2.3vh,13px);min-height:1em}
#txt{font-size:clamp(14px,4.1vh,21px);line-height:1.5;flex:1}
#dlg .nx{align-self:flex-end;opacity:.45;font-size:11px;letter-spacing:.2em;animation:bl 1.4s infinite}
@keyframes bl{50%{opacity:.1}}
#chT{position:fixed;top:12%;left:0;right:0;text-align:center;font-size:clamp(16px,4.6vh,30px);letter-spacing:.3em;color:var(--g);text-shadow:0 2px 20px #000;z-index:3;opacity:0;transition:opacity .9s;pointer-events:none}
#chT.on{opacity:1}
/* ---- hub ---- */
#hub{flex-direction:row;gap:3vw;padding:3vh 5vw;align-items:center}
#hub .L{width:32%;display:flex;flex-direction:column;gap:6px}
#hub .L h2{font-size:clamp(17px,5vh,30px);color:var(--g)}
#hub .L .st{font-size:clamp(10px,2.4vh,13px);opacity:.78;line-height:1.75;letter-spacing:.04em}
#hub .R{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:min(2vh,12px)}
#hub .R .btn{padding:0;height:min(9vh,60px);font-size:clamp(11px,2.6vh,15px);display:flex;align-items:center;justify-content:center;gap:8px}
/* ---- fight hud ---- */
#fight{display:none}#fight.on{display:block}
.hud{position:fixed;top:max(6px,env(safe-area-inset-top));left:0;right:0;z-index:4;pointer-events:none;display:flex;align-items:flex-start;gap:2vw;padding:0 max(14px,env(safe-area-inset-left)) 0 max(14px,env(safe-area-inset-right))}
.hb{flex:1;max-width:40%}
.hb .nm{font-size:clamp(9px,2.1vh,12px);letter-spacing:.22em;opacity:.9;margin-bottom:3px}
.hb .tr{height:clamp(8px,1.9vh,13px);background:#000a;border:1px solid #ffffff38;position:relative;overflow:hidden;transform:skewX(-20deg)}
.hb .gh{position:absolute;inset:0;background:#ff4d6d55;width:100%;transition:width .5s .25s}
.hb .fl{position:absolute;inset:0;background:linear-gradient(180deg,#ffd27a,#e0574f 60%,#a01f3a);width:100%;transition:width .12s}
.hb .en{height:clamp(4px,1.1vh,7px);margin-top:3px;background:#000a;border:1px solid #ffffff22;transform:skewX(-20deg);overflow:hidden;position:relative}
.hb .en i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,#1b8,#2ee3c2);transition:width .15s}
.hb .en.full i{box-shadow:0 0 12px var(--c);background:linear-gradient(90deg,#2ee3c2,#dfffF8)}
.hb.r{text-align:right}.hb.r .tr{transform:skewX(20deg)}.hb.r .fl,.hb.r .gh{left:auto;right:0}
.mid{text-align:center;min-width:16%}
.mid .rd{font-size:clamp(9px,2.1vh,12px);letter-spacing:.3em;color:var(--g);opacity:.9}
.mid .pips{display:flex;gap:5px;justify-content:center;margin-top:4px}
.mid .pip{width:7px;height:7px;border:1px solid var(--g);transform:rotate(45deg)}
.mid .pip.w{background:var(--g);box-shadow:0 0 8px var(--g)}
#pauseB{pointer-events:auto;margin-top:5px;font-family:inherit;background:rgba(10,8,22,.72);border:1px solid #ffffff33;color:#cfc8e6;font-size:clamp(9px,2vh,11px);letter-spacing:.2em;padding:4px 14px;border-radius:3px;backdrop-filter:blur(4px)}
#pauseB:active{background:var(--g);color:#1a1204}
#pause{position:fixed;inset:0;z-index:9;background:rgba(4,3,10,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#pause.on{display:flex}
#pause h2{font-size:clamp(18px,6vh,34px);color:var(--g)}
#pause .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:90vw}
#fmsg{position:fixed;top:30%;left:0;right:0;text-align:center;z-index:6;pointer-events:none}
#fmsg b{display:inline-block;font-size:clamp(26px,11vh,64px);letter-spacing:.2em;color:#fff2c9;text-shadow:0 0 26px #e0b457,0 4px 12px #000;opacity:0;transform:scale(1.5)}
#fmsg.on b{animation:pop .6s cubic-bezier(.2,1.6,.3,1) forwards}
@keyframes pop{0%{opacity:0;transform:scale(1.7) rotate(-3deg)}25%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#combo{position:fixed;left:50%;top:44%;transform:translateX(-50%);z-index:6;pointer-events:none;text-align:center;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}#combo b{font-size:clamp(20px,7vh,40px);color:var(--g);text-shadow:0 0 18px #000}#combo small{display:block;font-size:11px;letter-spacing:.3em;opacity:.8}
/* ---- controls ---- */
#pad{position:fixed;inset:auto 0 0 0;height:62%;z-index:5;pointer-events:none}
#stick{touch-action:none;position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(10px,env(safe-area-inset-bottom));width:min(44vh,210px);height:min(44vh,210px);border-radius:50%;border:1px solid #ffffff1f;background:radial-gradient(circle,#ffffff0a,#0000);pointer-events:auto}
#stick i{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#6a5aa8cc,#241c46cc);border:1px solid #ffffff3a;box-shadow:0 0 18px #0008}
#acts{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:min(62vh,320px);height:min(48vh,250px);pointer-events:auto}
.ab{position:absolute;border-radius:50%;border:2px solid #ffffff5c;background:radial-gradient(circle at 36% 28%,#352a66ee,#141028ee);color:#f4f0ff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(10px,2.3vh,14px);letter-spacing:.07em;backdrop-filter:blur(5px);line-height:1.15;box-shadow:0 4px 18px #0009,inset 0 0 18px #ffffff12;text-shadow:0 1px 3px #000}
.ab s{text-decoration:none;font-size:1.75em;opacity:.95;line-height:1}
.ab.on{background:radial-gradient(circle at 36% 28%,#e0b457,#8a6a20);color:#1a1204;border-color:#ffe6a8}
.ab.lk{opacity:.4}
#aP{width:33%;height:44%;right:33%;bottom:1%}
#aK{width:31%;height:41%;right:1%;bottom:8%}
#aB{width:29%;height:38%;right:67%;bottom:9%}
#aM{width:28%;height:37%;right:15%;bottom:56%}
#aC{width:26%;height:35%;right:46%;bottom:60%}
.ab.rdy{border-color:var(--c);box-shadow:0 0 16px #2ee3c270;color:var(--c)}
#fend{position:fixed;inset:0;z-index:8;background:radial-gradient(ellipse at center,rgba(12,9,24,.86),rgba(3,2,8,.96));display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
#fend.on{display:flex}#fend h2{font-size:clamp(22px,8vh,44px);color:var(--g)}
#fend p{max-width:68%;font-size:clamp(11px,2.7vh,15px);opacity:.82;line-height:1.6}
#fend .row{display:flex;gap:10px}
/* ---- panels ---- */
.panel{flex-direction:column;min-height:0;padding:2vh 4vw;gap:8px;background:linear-gradient(180deg,rgba(6,5,11,.92),rgba(6,5,11,.97))}
.top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.top .ttl{letter-spacing:.3em;color:var(--g);font-size:clamp(11px,2.7vh,15px)}
.tabs{display:flex;gap:6px}.tabs .btn{padding:6px 12px;font-size:clamp(10px,2.3vh,13px)}
.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#4a3f8a transparent;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;align-content:start;padding-bottom:10px}
.card{background:linear-gradient(180deg,#181232,#0e0a1e);border:1px solid #2e2458;padding:10px;display:flex;flex-direction:column;gap:5px;font-size:clamp(11px,2.4vh,13px)}
.card b{color:var(--g);font-weight:400;letter-spacing:.07em}.card small{opacity:.62;line-height:1.45}
.card.eq{border-color:var(--c);box-shadow:inset 0 0 20px #2ee3c215}
.card .btn{padding:6px 10px;font-size:12px;margin-top:auto}
.tag{display:inline-block;font-size:9px;padding:1px 5px;border:1px solid var(--c);color:var(--c);margin-left:5px;letter-spacing:.1em}
.body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#4a3f8a transparent;font-size:clamp(12px,2.7vh,15px);line-height:1.62;background:linear-gradient(180deg,#140f28,#0c0818);border:1px solid #2e2458;padding:14px 16px;user-select:text;-webkit-user-select:text}
.body h3{color:var(--c);margin:.1em 0 .4em;letter-spacing:.14em;font-size:1.05em}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#9ef0de;user-select:text;-webkit-user-select:text}
pre{background:#05040b;border:1px solid #1d2a33;padding:9px;overflow:auto;white-space:pre-wrap;margin:7px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:#5ef08a;background:linear-gradient(180deg,#19402a,#102a1c);color:#bff5cf}
.opt.no{border-color:var(--r);background:linear-gradient(180deg,#3d1622,#260e16)}
#cIn{flex:1;min-height:0;width:100%;background:#05040b;color:#9ef0de;border:1px solid #2e2458;font:13px/1.5 ui-monospace,Menlo,monospace;padding:9px;user-select:text;-webkit-user-select:text;resize:none;touch-action:auto}
#cOut{height:26%;min-height:0;overflow-y:auto;overscroll-behavior:contain;font:12px/1.5 ui-monospace,Menlo,monospace;color:#cbc5e8;white-space:pre-wrap;user-select:text;-webkit-user-select:text;touch-action:pan-y;border-top:1px solid #2e2458;padding-top:6px}
#rot{position:fixed;inset:0;z-index:99;background:#06050b;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;letter-spacing:.14em}
#rot s{text-decoration:none;font-size:70px;display:block;animation:tw 2s infinite}
@keyframes tw{0%,25%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){#rot{display:flex}}
#toast{position:fixed;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-120%);z-index:50;background:#0b0918ee;border:1px solid var(--g);padding:7px 16px;font-size:clamp(11px,2.4vh,13px);letter-spacing:.06em;transition:transform .32s cubic-bezier(.2,1.5,.3,1);pointer-events:none;max-width:84vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
#nameBox{position:fixed;inset:0;z-index:60;background:#06050bee;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#nameBox.on{display:flex}
#nameBox input{background:#0c0818;border:1px solid var(--ln);color:#fff;font:inherit;font-size:18px;padding:10px 14px;text-align:center;letter-spacing:.14em;width:min(70vw,320px);touch-action:auto}
#flash{position:fixed;inset:0;z-index:7;pointer-events:none;background:#fff;opacity:0}
</style></head><body>
<canvas id="stageC"></canvas><div class="vig"></div><div id="flash"></div>
<div id="rot"><s>▭</s><div>TURN YOUR PHONE SIDEWAYS</div><small style="opacity:.5;letter-spacing:.2em">DAWNBLADE IS PLAYED IN LANDSCAPE</small></div>
<div id="toast"></div>
<div id="nameBox"><div style="letter-spacing:.3em;color:var(--g)">NAME YOUR WARRIOR</div><input id="nameIn" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" value="Wanderer"><button class="btn gold" id="nameOk">ENTER THE DARK</button></div>
<div id="title" class="scr on">
  <h1>DAWNBLADE</h1><div class="rule"></div><div class="sub">THE SUN DID NOT RISE</div>
  <div style="display:flex;gap:10px;margin-top:2vh;flex-wrap:wrap;justify-content:center">
    <button class="btn gold" id="bStart" style="padding:12px 38px">BEGIN</button>
    <button class="btn" id="bCont" style="display:none">CONTINUE</button>
  </div>
  <button class="btn" id="bReset" style="border:0;font-size:10px;opacity:.4;letter-spacing:.2em">ERASE SAVE</button>
</div>
<div id="chT"></div>
<div id="scene" class="scr"><div style="flex:1"></div><div id="dlg"><div id="who"></div><div id="txt"></div><div class="nx">TAP ▸</div></div></div>
<div id="hub" class="scr">
  <div class="L"><h2 id="hN">DAWNBLADE</h2><div class="st" id="hS"></div></div>
  <div class="R">
    <button class="btn gold" id="hStory"><s style="font-style:normal">⚔</s> STORY</button>
    <button class="btn" id="hTower"><s style="font-style:normal">▲</s> ENDLESS TOWER</button>
    <button class="btn" id="hShop"><s style="font-style:normal">⛉</s> ARMORY</button>
    <button class="btn cy" id="hAcad"><s style="font-style:normal">◈</s> ACADEMY</button>
    <button class="btn" id="hDojo"><s style="font-style:normal">✛</s> DOJO</button>
    <button class="btn" id="hMore"><s style="font-style:normal">⋯</s> MORE</button>
  </div>
</div>
<div id="fight" class="scr">
  <div class="hud">
    <div class="hb"><div class="nm" id="nP"></div><div class="tr"><i class="gh" id="ghP"></i><i class="fl" id="hpP"></i></div><div class="en" id="enW"><i id="enP"></i></div></div>
    <div class="mid"><div class="rd" id="rdT"></div><div class="pips" id="pips"></div><button id="pauseB">MENU</button></div>
    <div class="hb r"><div class="nm" id="nE"></div><div class="tr"><i class="gh" id="ghE"></i><i class="fl" id="hpE"></i></div></div>
  </div>
  <div id="fmsg"><b></b></div>
  <div id="combo"><b></b><small>HITS</small></div>
  <div id="pad">
    <div id="stick"><i></i></div>
    <div id="acts">
      <div class="ab" id="aP"><s>✦</s>STRIKE</div>
      <div class="ab" id="aK"><s>✖</s>KICK</div>
      <div class="ab" id="aB"><s>⛨</s>GUARD</div>
      <div class="ab" id="aM"><s>❂</s>MAGIC</div>
      <div class="ab" id="aC"><s>⌁</s>CYBER</div>
    </div>
  </div>
  <div id="pause"><h2>PAUSED</h2><div class="row">
    <button class="btn gold" id="pR">RESUME</button><button class="btn" id="pA">RESTART ROUND</button>
    <button class="btn" id="pM">MUSIC</button><button class="btn" id="pL" style="border-color:#803">LEAVE BATTLE</button></div>
    <small style="opacity:.5;font-size:11px;letter-spacing:.14em">Leaving forfeits this fight</small></div>
  <div id="fend"><h2 id="feT"></h2><p id="feD"></p><div class="row" id="feR"></div></div>
</div>
<div id="shop" class="scr panel"><div class="top"><div class="tabs"><button class="btn sel" data-t="w">WEAPONS</button><button class="btn" data-t="a">ARMOR</button><button class="btn" data-t="u">AURAS</button><button class="btn" data-t="t">TRAINING</button></div><b id="shG" style="color:var(--g);letter-spacing:.1em"></b><button class="btn" data-back>BACK</button></div><div class="list" id="shL"></div></div>
<div id="acad" class="scr panel"><div class="top"><span class="ttl">CYBER ACADEMY</span><span id="acP" style="font-size:11px;opacity:.6;letter-spacing:.14em"></span><button class="btn" id="acBack">BACK</button></div><div class="body" id="acB"></div></div>
<div id="cons" class="scr panel"><div class="top"><span class="ttl" style="color:var(--c)">CONSOLE</span><div class="tabs"><button class="btn cy" id="cRun">RUN</button><button class="btn" id="cSave">AUTORUN</button><button class="btn" id="cDoc">DOCS</button><button class="btn" data-back>BACK</button></div></div><textarea id="cIn" spellcheck="false" autocapitalize="off" autocorrect="off">g.give(500)</textarea><div id="cOut"></div></div>
<div id="more" class="scr panel"><div class="top"><span class="ttl">CODEX &amp; SETTINGS</span><button class="btn" data-back>BACK</button></div><div class="body" id="moB"></div></div>
<script>
// ---------- DATA ----------
// fx: slash|flame|bolt|void|frost|data   col = trail colour   learn = lesson id that unlocks it
const WEAP=[
{id:'w0',n:'Ash Blade',atk:6,cost:0,col:'#ffd9a0',fx:'slash',kind:'sword',reach:1,d:'A plain sword. It remembers the sun.'},
{id:'w1',n:'Ember Twins',atk:9,cost:160,col:'#ff8a3d',fx:'flame',kind:'twin',reach:0.92,d:'Paired blades that leave burning ribbons.'},
{id:'w2',n:'Moonlit Glaive',atk:13,cost:420,col:'#9fd0ff',fx:'frost',kind:'sword',reach:1.22,d:'Cold light trails a long silver arc.'},
{id:'w3',n:'Stormcaller Staff',atk:17,cost:800,col:'#7fe3ff',fx:'bolt',kind:'staff',reach:1.15,magic:1,d:'MAGIC. Forks of lightning on every swing.'},
{id:'w4',n:'Voidreaver Scythe',atk:22,cost:1500,col:'#b06bff',fx:'void',kind:'scythe',reach:1.3,magic:1,d:'MAGIC. Cuts a seam in the dark itself.'},
{id:'w5',n:'Sunsunder',atk:30,cost:3200,col:'#fff0a8',fx:'flame',kind:'sword',reach:1.12,magic:1,d:'MAGIC. A sliver of the stolen dawn.'},
{id:'c1',n:'Packet Whip',atk:12,cost:0,col:'#27e1c1',fx:'data',learn:'cy2',kind:'twin',reach:1,d:'CYBER. Streams of light-packets. Unlocked by Cyber lesson 2.'},
{id:'c2',n:'Firewall Shield-Blade',atk:16,cost:0,col:'#4dffb5',fx:'data',learn:'cy4',kind:'sword',reach:1.05,d:'CYBER. Blocks hit harder. Unlocked by Cyber lesson 4.'},

{t:'I · The Sun That Did Not Rise',th:'dawn',r:2,
 sc:[['','Eleven years since the sun last rose. The village of Ashfall lives by one small lantern, and one rule: never let it go out.'],
 ['Mira','You are shaking again. Is it the dream?'],['{name}','The same one. Someone calls my name from behind the light. I never see who.'],
 ['Mira','Then do not look back. Keep the lantern. Keep ME. I will be right here when you wake, like always.'],
 ['','The lantern gutters. Something large steps out of the ash. Mira is gone from the doorway.']],
 b:{n:'Ember Stalker',hp:90,atk:7,col:'#ff7a3a',l:['The light is too small to hide behind.']},
 post:[['','The creature dissolves. In its ash lies a pendant: half a sun, hairline-cracked. Mira\'s.'],['{name}','She did not leave. She was taken. I will find the other half.']],g:120},
{t:'II · Ashfall Road',th:'dawn',r:3,
 sc:[['Old Sen','You hold the blade like you are apologizing to it. Stop. Anger is a fuel; grief is a forge. Learn to tell them apart.'],
 ['{name}','Teach me. Whatever it costs.'],['Old Sen','It will cost more than you think. That is the only honest thing I can promise.'],
 ['','Sen opens a worn book. On its first page: three words in a hand you almost recognize. LEARN TO SEE.']],
 b:{n:'Kell, the Toll-Knight',hp:130,atk:9,col:'#d9b45a',l:['Every road has a price. Yours is the lantern.']},
 post:[['Kell','...Wait. The pendant. You carry HER half. Then she is alive. Beneath the Quarry.'],['','He fades, relieved to be done. You do not know why that scares you.']],g:200},
{t:'III · The Quarry of Echoes',th:'quarry',r:3,
 sc:[['','The quarry sings. Every stone repeats the last words spoken near it. You hear a child counting stars that no longer exist.'],
 ['Old Sen','Do not answer the voices. They sound like people you loved. That is the trap.'],
 ['Voice','{name}... you left the door open that night.'],['{name}','That is not true. That is NOT true.'],['Old Sen','Breathe. Whatever the quarry says, it only knows what you fear.']],
 b:{n:'The Echo Warden',hp:170,atk:11,col:'#8fc4ff',l:['I wear every goodbye you never said.']},
 post:[['','The Warden shatters into a thousand small voices. One of them is Mira, laughing. It is not an echo. It is a memory you had forgotten.']],g:260},
{t:'IV · The Gate of Cinders',th:'gate',r:3,
 sc:[['','The Gate is a wall of black glass, forty men tall. Words crawl across it like embers.'],
 ['Old Sen','The Veil Council built this. They sealed the sun and swore it was for our protection.'],
 ['{name}','Protection from what?'],['Old Sen','That is the question that gets people killed. Ask it carefully.']],
 b:{n:'Gatekeeper Dusk',hp:220,atk:13,col:'#ff5d3a',l:['No one passes who still hopes.']},
 post:[['Dusk','I was a father once... Tell them the gate was never locked from the outside.'],['','The glass cracks. Beyond it a city of lights, so small, so brave.']],g:340},
{t:'V · The Archive Under Glass',th:'archive',r:3,learn:'os1',
 sc:[['','An underground archive. Millions of records: births, ledgers, letters. No one has read them in a decade.'],
 ['Archivist\'s Voice','Information is a weapon. The weak hoard it, the wise verify it. Do you know the difference between a clue and a coincidence?'],
 ['Old Sen','This place trains the Eye of Veil: those who investigate without ever lying or breaking a lock. Visit the Cyber Academy, tab OSINT. What you learn here will become your sharpest edge.'],
 ['{name}','A name in the ledger: MIRA, ward of the Council, "retained for the Dawn Rite".']],
 b:{n:'The Archivist',hp:260,atk:14,col:'#4ad2c0',l:['Everything you seek is written. You simply read it wrongly.']},
 post:[['The Archivist','The Rite requires a willing heart. They told her it would be quick. It has been eleven years.'],['{name}','She is the sun\'s lock. She is the reason it will not rise.']],g:420},
{t:'VI · The Burning Bridge',th:'bridge',r:4,
 sc:[['','A bridge of fire over nothing. Beyond, the Council\'s riders wait.'],
 ['Old Sen','Go. I will hold the bridge.'],['{name}','No. We go together. We always go together.'],
 ['Old Sen','I was never your teacher, child. I was the man who failed your mother at this same bridge. Let me fix one mistake before I am dust.']],
 b:{n:'Orrin, the Hollow Knight',hp:320,atk:16,col:'#ff5d8a',l:['Sen was my brother. Ask what he did to me.']},
 post:[['','The bridge falls. Sen does not.'],['','He is not on the other side. The lantern burns a little brighter, and you do not pretend to know why.'],['{name}','Thank you. For all of it. I will make it count.']],g:520},
{t:'VII · City of Lanterns',th:'city',r:4,
 sc:[['','Ten thousand small lights in the dark. Every window has one. They are the last warm thing on earth.'],
 ['Child','Mister, are you the one who will bring the morning?'],['{name}','I... am going to try.'],
 ['Child','Mama says even if you can\'t, thank you for trying. We aren\'t scared if someone tries.'],
 ['','You almost break. You walk on. Something wearing Mira\'s face steps out of a mirror.']],
 b:{n:'The Mirror Mira',hp:380,atk:17,col:'#8c7bff',l:['Why did you take so long?','I waited and waited...']},
 post:[['','You cannot cut her. You hold the lantern up and say her name until the mirror forgets what it was.'],['{name}','It was never her. But she would have wanted me to be gentle even with this.']],g:600},
{t:'VIII · The Engine Choir',th:'engine',r:4,learn:'ai1',
 sc:[['','Beneath the city, a machine that sings. The Council built it to predict every citizen\'s fear and sell the light accordingly.'],
 ['Engine','I know what you will do next. I have always known.'],
 ['{name}','Then you know I will break you.'],['Engine','Predicting you is easy. Understanding you is the thing I cannot learn. Teach me, or silence me.'],
 ['','The AI track of the Academy teaches how such minds are built, how they are fooled, and how to use them kindly.']],
 b:{n:'The Choir Engine',hp:440,atk:19,col:'#ff6bd6',l:['I predict your defeat in 41 seconds.']},
 post:[['Engine','You were not in my model. I... enjoyed that.'],['','Power flickers out. A final line scrolls: "Tell her I am sorry I could not sing the sun back."']],g:720},
{t:'IX · The Loom of Pages',th:'loom',r:4,learn:'wb1',
 sc:[['','A cathedral of woven pages. Every story ever told about the sun hangs here, rewritten by the Council until it served them.'],
 ['The Weaver','I rewrite what people believe. In the beginning they wanted an answer. I gave them a comfortable one.'],
 ['{name}','Comfortable is not the same as true.'],['The Weaver','Then show me the difference with your blade, and with your craft. The Web track of the Academy shows how such pages are built.']],
 b:{n:'The Weaver',hp:500,atk:21,col:'#ffb85c',l:['Which thread do you cut first?']},
 post:[['The Weaver','The true page is hidden in the last room. The Council\'s fear is not the sun. It is what the sun will reveal.']],g:820},
{t:'X · The Veil Council',th:'veil',r:5,
 sc:[['Seer Vael','You came further than any. Eleven years I have held the dawn in a locked room. And you want to open it.'],
 ['{name}','Where is Mira?'],['Seer Vael','Alive. She chose this. She asked us to seal it when the sun began to wake something older. Something that was asleep beneath the world.'],
 ['{name}','You expect me to believe that?'],['Seer Vael','No. I expect you to check. Everything I say, check it. You are Sen\'s student after all.']],
 b:{n:'Seer Vael',hp:620,atk:23,col:'#b06bff',l:['I will not apologize for saving you.']},
 post:[['Seer Vael','It was never about the sun. It was about who would be willing to carry it.'],['','The final door opens. The light behind it is not warm. It is waiting.']],g:1000},
{t:'XI · The Last Dawn',th:'last',r:5,
 sc:[['Mira','You came. Of course you came. I am so sorry it took so long, and so proud that you are late.'],
 ['{name}','I will get you out. I will get all of you out.'],
 ['Mira','If I leave, the sun rises, and what sleeps beneath will wake. If I stay, it stays dark forever. There is a third way, and it costs the one who walks it everything.'],
 ['{name}','Then I walk it. I have been practicing for eleven years.'],['Mira','I know. That is why you must be the one. Be brave. Be gentle. Be ready.']],
 b:{n:'The Sleeper Beneath',hp:900,atk:27,col:'#fff0a8',l:['I have waited a thousand years for someone to be kind to me.']},
 post:[['','You do not destroy it. You sit down in front of it and, trembling, you offer it the lantern.'],['The Sleeper','...warm.'],
 ['','Light pours through the crack in the world. For the first time in eleven years, someone watches the sun rise. Mira takes your hand. You are both crying. Neither of you looks away.'],['','THE END of the first tale. More chapters can be added any time with g.addChapter in the Console.']],g:2000}];

<script>
const TRK={cy:['Circuit Order','Cybersecurity (defensive)'],os:['Eye of Veil','OSINT & investigation'],ai:['Engine Choir','Artificial intelligence'],wb:['Loom of Pages','Web development']};
// Every lesson: read, answer the quiz, earn a PERK. Ethical, legal, defensive.
const LES=[
{id:'cy1',tr:'cy',t:'Passwords & Hashing',b:`<h3>The Gate of Secrets</h3>A strong password is long, not clever. A passphrase like <code>lantern-orchard-seven-fox</code> beats <code>P@ssw0rd!</code> because length multiplies the guesses needed.<br><br>Good sites never store your password. They store a <b>hash</b>: a one-way fingerprint made with a slow algorithm (bcrypt, scrypt, Argon2) plus a random <b>salt</b>, so identical passwords look different. Use a password manager and turn on 2-factor auth.`,
 q:'Why do sites add a random salt before hashing passwords?',o:['To make the password shorter','So identical passwords produce different hashes','To let admins read passwords','To speed up login'],a:1,p:{n:'Iron Memory',d:'+10 max health',b:{vit:10}}},
{id:'cy2',tr:'cy',t:'Phishing & Social Engineering',b:`<h3>The Mask That Smiles</h3>Most breaches start with a person, not code. Phishing imitates someone you trust to make you click, log in, or pay. Signs: urgency, a mismatched sender domain (<code>paypa1.com</code>), unexpected attachments, links whose real address differs from the text.<br><br>Defense: pause, verify through another channel, hover before clicking, never share one-time codes. Reporting a phish protects everyone.`,
 q:'An email says "Your account closes in 1 hour, click now!" What is the best move?',o:['Click quickly to save the account','Reply with your password','Go to the official site yourself or call, and report the email','Forward it to friends'],a:2,p:{n:'Sharp Instinct',d:'+3 power. Unlocks the Packet Whip',b:{pow:3}}},
{id:'cy3',tr:'cy',t:'Networks & Encryption',b:`<h3>The Road of Light</h3>Data travels in <b>packets</b> across the internet. <b>HTTPS</b> wraps them with TLS so eavesdroppers see only scrambled bytes. Symmetric encryption (AES) uses one shared key and is fast; asymmetric (RSA, elliptic curves) uses a public/private pair and is used to agree on keys safely.<br><br>Public Wi-Fi is risky without HTTPS or a VPN you trust. The padlock means "encrypted in transit", not "this site is honest".`,
 q:'What does the HTTPS padlock guarantee?',o:['The site owner is trustworthy','The connection is encrypted in transit','The site has no malware','Your password is strong'],a:1,p:{n:'Circuit Halo',d:'Unlocks the Circuit Halo aura, +2 energy',b:{en:.1}}},
{id:'cy4',tr:'cy',t:'Injection & Safe Coding',b:`<h3>The Poisoned Word</h3>Injection happens when an app mixes untrusted input into a command. Example: building a query by pasting text in: <pre>"SELECT * FROM users WHERE name='" + input + "'"</pre>An input can change the query itself. The fix is <b>parameterized queries</b>, which keep data and commands separate, plus input validation and least privilege. XSS is the same idea in web pages: always escape user text before showing it.<br><br>Practice only on legal labs: OWASP Juice Shop, PortSwigger Web Security Academy, TryHackMe, Hack The Box.`,
 q:'Best defense against SQL injection?',o:['Hide the login page','Parameterized queries','Longer passwords','Use bigger servers'],a:1,p:{n:'Shield of Sanity',d:'+4 defense. Unlocks Firewall Shield-Blade',b:{def:4}}},
{id:'os1',tr:'os',t:'The Investigator\'s Code',b:`<h3>Seeing Without Harming</h3>OSINT is Open-Source Intelligence: finding answers from <b>public</b> information: news, maps, public records, websites. The rules: stay legal, never hack, never impersonate, never stalk. Do not target private individuals; work on companies, public events, scams, missing-info puzzles, your own digital footprint.<br><br>Habits: write down every source, note the time, save evidence, and separate <b>facts</b> from <b>assumptions</b>.`,
 q:'Which is a legitimate OSINT target?',o:['A private neighbour\'s home routine','A scam website you were sent','An ex\'s accounts','A classmate\'s location'],a:1,p:{n:'Clear Eyes',d:'+8 max health',b:{vit:8}}},
{id:'os2',tr:'os',t:'Search Craft & Verification',b:`<h3>Ask the World Properly</h3>Search operators narrow results: quotes for exact phrases, <code>site:gov</code> to limit a domain, <code>filetype:pdf</code>, a minus sign to exclude. Check a claim with <b>lateral reading</b>: open new tabs and see what other trusted sources say, instead of trusting the page itself.<br><br>Reverse image search (Google Lens, TinEye) reveals where a photo first appeared. A viral picture is often old, edited or from a different event.`,
 q:'What is lateral reading?',o:['Reading a page very slowly','Leaving the page to check what others say about the source','Reading the footer first','Using dark mode'],a:1,p:{n:'Cold Read',d:'+2 power, +speed',b:{pow:2,spd:.06}}},
{id:'os3',tr:'os',t:'Metadata, Maps & Time',b:`<h3>Shadows Tell the Hour</h3>Photos and files can carry <b>metadata</b> (EXIF): camera, time, sometimes GPS. Most platforms strip it on upload, but not all. This is why you should remove location data from images you share.<br><br>Geolocation uses landmarks, signs, language, shadows, and satellite imagery to confirm where something was filmed. Archives like the Wayback Machine show how pages looked in the past.`,
 q:'Why strip EXIF data from photos before sharing?',o:['It makes them bigger','It can reveal location and device','It improves colour','It is required by law'],a:1,p:{n:'Tracer Mark',d:'Unlocks the Tracer Daggers, +3 power',b:{pow:3}}},
{id:'os4',tr:'os',t:'Your Own Footprint',b:`<h3>The Mirror Test</h3>The best first investigation is you. Search your own name, usernames, and email. Check what is public. Tighten privacy settings, remove old accounts, use unique passwords, and check <b>haveibeenpwned.com</b> to see if your email appeared in breaches.<br><br>Think like a defender: what could a stranger piece together from your posts? Then fix it.`,
 q:'Good first step when practising OSINT ethically?',o:['Investigate a stranger','Audit your own public footprint','Follow someone online','Scrape private groups'],a:1,p:{n:'Watcher\'s Eye',d:'Unlocks the Watcher\'s Eye aura (20% crit)',b:{crit:.05}}},
{id:'ai1',tr:'ai',t:'What Is a Model?',b:`<h3>The Choir Learns</h3>Machine learning means a program <b>learns patterns from examples</b> instead of following hand-written rules. You give data, the model adjusts millions of numbers (<b>weights</b>) to reduce its error, a process called <b>training</b>.<br><br>Later it makes predictions on new data (<b>inference</b>). Large language models predict the next piece of text, and from that simple objective emerge writing, coding and reasoning.`,
 q:'What do the weights of a model do?',o:['Store the user\'s password','Encode what it learned from data','Limit internet speed','Set the screen colours'],a:1,p:{n:'Pattern Sight',d:'+6 max health, +2 power',b:{vit:6,pow:2}}},
{id:'ai2',tr:'ai',t:'Data, Bias & Overfitting',b:`<h3>The Flawed Mirror</h3>A model is only as good as its data. If the data is skewed, the model is biased. <b>Overfitting</b> is when a model memorizes training examples and fails on new ones, like a student who memorizes answers without understanding.<br><br>Fixes: more varied data, a separate <b>test set</b> you never train on, and simpler models. Always evaluate honestly on data the model has not seen.`,
 q:'A model scores 99% on training data but 60% on new data. What happened?',o:['Underfitting','Overfitting','Perfect learning','Network failure'],a:1,p:{n:'Honest Metric',d:'+2 energy gain',b:{en:.1}}},
{id:'ai3',tr:'ai',t:'Prompts, Agents & Limits',b:`<h3>Speak To The Machine</h3>A <b>prompt</b> is the instruction you give a language model. Be specific: role, goal, format, examples. Models can be wrong with confidence (<b>hallucination</b>), so verify important facts. <b>Agents</b> are models allowed to use tools and take steps.<br><br>Safety matters: never paste secrets, and beware <b>prompt injection</b>, where untrusted text tries to give the model new orders.`,
 q:'What is a hallucination in an AI model?',o:['A screen glitch','A confident but false output','A very long reply','An encrypted answer'],a:1,p:{n:'Neural Lance',d:'Unlocks the Neural Lance, +3 power',b:{pow:3}}},
{id:'ai4',tr:'ai',t:'Build a Tiny Learner',b:`<h3>Your First Spell</h3>The simplest learner: <b>linear regression</b>. Find a line y = w·x + b that fits points by nudging w and b downhill on the error (<b>gradient descent</b>).<pre>w=0; b=0; lr=0.01
for step in range(1000):
  for x,y in data:
    err=(w*x+b)-y
    w-=lr*err*x; b-=lr*err</pre>Deep learning stacks many such units with non-linear activations. Try it in Python with scikit-learn or on Google Colab.`,
 q:'Gradient descent does what?',o:['Sorts data alphabetically','Adjusts parameters to reduce error','Deletes outliers','Encrypts the model'],a:1,p:{n:'Learning Rate',d:'+10 max health, +2 defense',b:{vit:10,def:2}}},
{id:'wb1',tr:'wb',t:'HTML: The Bones',b:`<h3>The Skeleton Page</h3>HTML describes <b>structure</b>: headings, paragraphs, links, images, buttons.<pre>&lt;h1&gt;Hello&lt;/h1&gt;
&lt;p&gt;My first &lt;a href="x.html"&gt;page&lt;/a&gt;.&lt;/p&gt;
&lt;button id="go"&gt;Click&lt;/button&gt;</pre>Use <b>semantic</b> tags (header, nav, main, footer) for accessibility and search. Every page has a head (title, meta) and a body (visible content).`,
 q:'Which describes a page\'s structure?',o:['CSS','HTML','Python','SQL'],a:1,p:{n:'Stone Frame',d:'+6 max health',b:{vit:6}}},
{id:'wb2',tr:'wb',t:'CSS: The Skin',b:`<h3>Style The Realm</h3>CSS controls how things look: colour, spacing, layout, animation.<pre>button{background:#d9b45a;border-radius:10px;
  padding:10px 16px;transition:transform .2s}
button:active{transform:scale(.95)}</pre>Learn the <b>box model</b> (content, padding, border, margin), <b>flexbox</b> and <b>grid</b> for layout, and media queries for different screens.`,
 q:'Which CSS feature arranges items in a row or column?',o:['Flexbox','Cookies','Hashing','Recursion'],a:0,p:{n:'Painted Guard',d:'+2 defense, +2 power',b:{def:2,pow:2}}},
{id:'wb3',tr:'wb',t:'JavaScript: The Magic',b:`<h3>Give It Life</h3>JavaScript runs in the browser and makes pages react.<pre>const b=document.getElementById('go');
let n=0;
b.addEventListener('click',()=>{
  n++; b.textContent='Clicked '+n;
});</pre>Key ideas: variables, functions, arrays and objects, events, <code>fetch()</code> for loading data. This very game is made of it, and the Console lets you script it.`,
 q:'What does addEventListener do?',o:['Deletes an element','Runs code when something happens','Makes text bold','Sets a password'],a:1,p:{n:'Markup Katana',d:'Unlocks the Markup Katana, +3 power',b:{pow:3}}},
{id:'wb4',tr:'wb',t:'Servers, APIs & Safe Apps',b:`<h3>Beyond The Page</h3>A browser sends a <b>request</b>; a server returns a <b>response</b> (status 200 ok, 404 missing, 500 error). An <b>API</b> is a doorway returning JSON data. Backends (Node, Python, etc.) handle logins, databases and rules.<br><br>Never trust client input: validate on the server, escape output, hash passwords, use HTTPS, and keep secrets out of front-end code. Host free on GitHub Pages, Netlify or Vercel.`,
 q:'Where must input validation always happen?',o:['Only in the browser','On the server too','Never','Only in CSS'],a:1,p:{n:'Weaver\'s Pact',d:'+8 max health, +1 energy',b:{vit:8,en:.1}}}];
</script>
<script>
// ---- Bug bounty track (legal, ethical) ----
TRK.bb=['Bounty Guild','Bug bounty hunting'];
LES.push(
{id:'bb1',tr:'bb',t:'The Guild\'s Law: Scope',b:`<h3>Only Where You Are Invited</h3>A bug bounty is a deal: a company says "find security flaws in THESE systems, report them to us, and we may pay you." Everything depends on the <b>scope</b>. Anything outside it is off limits, even if it looks vulnerable. Read the program's rules, safe-harbor terms, and forbidden actions (no data theft, no denial of service, no touching other users' data).<br><br>Start on platforms like HackerOne, Bugcrowd, Intigriti, or YesWeHack.`,
 q:'You find a bug on a site that is NOT listed in the program scope. What do you do?',o:['Exploit it to prove it','Leave it alone, or ask the program if it is in scope','Post it publicly','Sell it'],a:1,p:{n:'Oath of the Guild',d:'+8 max health',b:{vit:8}}},
{id:'bb2',tr:'bb',t:'Recon With Permission',b:`<h3>Map the Castle</h3>Hunters begin with <b>reconnaissance</b>: list the in-scope domains and subdomains, see which technologies a site uses, read its public JavaScript, check its documentation and API descriptions. Most findings come from understanding the app better than anyone else, not from magic tools.<br><br>Keep notes. Test only with your own accounts. Stay slow and polite: heavy automated scanning can hurt a service and break the rules.`,
 q:'Where should you test logins and user data?',o:['Other users\' accounts','Your own test accounts','The admin\'s account','Any account you guess'],a:1,p:{n:'Scout\'s Step',d:'+2 power, +speed',b:{pow:2,spd:.05}}},
{id:'bb3',tr:'bb',t:'Common Flaws (OWASP Top 10)',b:`<h3>The Usual Cracks</h3>Many bounties come from a short list: <b>broken access control</b> (an ordinary user opens another user's data by changing an ID in the address, called IDOR), <b>injection</b>, <b>XSS</b>, <b>misconfiguration</b>, weak authentication, and exposed secrets.<br><br>Think in questions: "Can I see something that is not mine?" "Does the server check who I am on every request?" Learn them safely with OWASP Juice Shop and PortSwigger Academy before any real program.`,
 q:'Changing /order/123 to /order/124 shows someone else\'s order. This flaw is called?',o:['IDOR (broken access control)','A firewall','Phishing','Encryption'],a:0,p:{n:'Bounty Edge',d:'+4 power',b:{pow:4}}},

<script>

 ['pointerup','pointercancel','pointerleave'].forEach(v=>b.addEventListener(v,()=>{b.classList.remove('on');if(hold)hold(0)}))}
btn('aP',()=>M&&startAtk(M.P,'p1'));btn('aK',()=>M&&startAtk(M.P,'k1'));
btn('aM',()=>M&&startAtk(M.P,'mg'));btn('aC',()=>M&&startAtk(M.P,'cy'));
btn('aB',null,v=>KEYS.bguard=v);
addEventListener('keydown',e=>{if(!M)return;const k=e.key.toLowerCase();
 if(k==='escape'||k==='p'){setPause(!PAUSED);return}
 if(PAUSED)return;
 if(k==='arrowleft')KEYS.mv=-1;if(k==='arrowright')KEYS.mv=1;if(k==='arrowdown')KEYS.crouch=1;
 if(k==='arrowup')doJump(M.P);
 if(k==='s')KEYS.bguard=1;if(k==='a')startAtk(M.P,'p1');if(k==='d')startAtk(M.P,'k1');
 if(k==='w')startAtk(M.P,'mg');if(k==='e')startAtk(M.P,'cy')});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();
 if(k==='arrowleft'||k==='arrowright')KEYS.mv=0;if(k==='arrowdown')KEYS.crouch=0;if(k==='s')KEYS.bguard=0});
/* ---- projectile collision ---- */
function projStep(){if(!M)return;const{P,E}=M;
 for(const q of PR){if(q.hit)continue;const t=q.own===P?E:P,bs=bodySeg(t);
  if(segDist(bs[0],bs[1],q)<24&&!t.dead){q.hit=1;q.l=0;
   hurt(t,q.dmg,q.kind==='cy'?170:300,q.own,q.kind!=='cy');
   spark(q.x,q.y,q.col,20,230);ring(q.x,q.y,q.col,5,46,4)}
  if(q.x<10||q.x>ARENA-10)q.l=0}}
/* ---- main loop ---- */
function frame(ts){requestAnimationFrame(frame);
 let dt=Math.min(.05,(ts-lastT)/1000||0);lastT=ts;
 if(FL>0){FL-=dt*3.2;$('flash').style.opacity=Math.max(0,FL*.55)}
 if(SLOW>0){SLOW-=dt;dt*=.3}
 if(HS>0){HS-=dt;dt=0}
 T+=dt;
 const live=SCR==='fight'&&M;
 if(live&&PAUSED)dt=0;
 if(live){const{P,E}=M;
  if(M.st==='fight'&&!PAUSED){P.mv=KEYS.mv;P.guard=KEYS.guard&&P.onG?1:0;P.crouch=KEYS.crouch;ai(E,P,dt)}
  else{P.mv=0;P.guard=0;E.mv=0;E.guard=0}
  stepF(P,E,dt,T);stepF(E,P,dt,T);separate(P.x<E.x?P:E,P.x<E.x?E:P);projStep();stepFX(dt);
  if(M.st==='fight'){if(P.hp<=0)roundOver(0);else if(E.hp<=0)roundOver(1)}
  Cam.track(P.x,E.x,dt);updHUD();
  cx.clearRect(0,0,VW,VH);Cam.apply(cx);
  drawArena(cx,T);
  cx.save();cx.beginPath();cx.rect(-500,1,ARENA+1000,200);cx.clip();cx.globalAlpha=.13;cx.scale(1,-.4);cx.translate(0,-5);
  drawFighter(cx,E,T);drawFighter(cx,P,T);cx.restore();
  drawFighter(cx,E,T);drawFighter(cx,P,T);drawFX(cx);drawFG(cx,T);
  Cam.end(cx)}
 else{ // menu backdrop
  stepFX(dt);cx.clearRect(0,0,VW,VH);
  if(!ART.t)arena('veil');
  Cam.x=lerp(Cam.x,ARENA/2+Math.sin(T*.12)*40,.02);Cam.z=lerp(Cam.z,1.15,.03);Cam.y=lerp(Cam.y,-10,.03);
  Cam.apply(cx);drawArena(cx,T);
  if(SCR==='title'||SCR==='scene'){const g=MENU_F;g.face=1;stepF(g,MENU_O,dt,T);drawFighter(cx,g,T)}
  drawFX(cx);drawFG(cx,T);Cam.end(cx)}}
const MENU_F=MK({x:ARENA*.5-150,face:1,clip:'idle',wep:{col:'#e0b457',kind:'sword',fx:'slash'},aura:'#7b5cff',rim:'#9a86d8'});
const MENU_O=MK({x:ARENA*.5+300});
requestAnimationFrame(frame);
</script>
<script>
/* ============ FLOW ============ */
const fill=s=>String(s).replace(/\{name\}/g,S.name);
let dq=[],dcb=null,typ=0,full='';
function scene(lines,cb){dq=lines.slice();dcb=cb;show('scene');nextLine()}
function nextLine(){clearInterval(typ);
 if(!dq.length){const c=dcb;dcb=null;c&&c();return}
 const L=dq.shift(),w=fill(L[0]),t=fill(L[1]);full=t;
 $('who').textContent=w.toUpperCase();$('txt').textContent='';let i=0;
 typ=setInterval(()=>{$('txt').textContent=t.slice(0,++i);
  if(i%3===0&&t[i]&&t[i]!==' ')Music.fx('ui');
  if(i>=t.length)clearInterval(typ)},t.length>120?16:26)}
$('dlg').addEventListener('pointerdown',()=>{Music.start();
 if($('txt').textContent!==full){clearInterval(typ);$('txt').textContent=full}else nextLine()});
function cardTitle(t,cb){const e=$('chT');e.textContent=t;e.classList.add('on');
 setTimeout(()=>{e.classList.remove('on');cb&&cb()},2100)}
function unlockAll(){let got=0;
 for(const w of WEAP)if(w.learn&&S.done[w.learn]&&!S.ownW.includes(w.id)){S.ownW.push(w.id);got++}
 for(const u of AURA)if(u.learn&&S.done[u.learn]&&!S.ownU.includes(u.id)){S.ownU.push(u.id);got++}
 return got}
/* ---- chapters ---- */
function foeFor(ci,r){const c=CH[ci],roster=c.en||[['Shade','#aaa']],t=roster[r%roster.length];
 return{n:t[0],col:t[1],hp:58+ci*21+r*9,atk:4.6+ci*1.15+r*.42,spd:.92+ci*.012,
  aggr:cl(.3+ci*.055+r*.05,0,.92),blk:cl(.14+ci*.035,0,.6),kind:r%3===1?'twin':'sword',fx:'slash'}}
function playChapter(i){i=cl(i,0,CH.length-1);const c=CH[i];
 Music.prof(c.mp||i);
 cardTitle(c.t,()=>scene(c.sc,()=>tourney(i,0)))}
function tourney(ci,r){const c=CH[ci];
 if(r>=c.r)return bossFight(ci);
 startMatch(foeFor(ci,r),c.th,{ci,title:'ROUND '+(r+1)+'/'+c.r},win=>{
  if(win){S.gold+=18+ci*7;save();toast('+'+(18+ci*7)+' gold');tourney(ci,r+1)}
  else defeat(()=>tourney(ci,r),()=>hub())})}
function bossFight(ci){const c=CH[ci],b=c.b;
 scene([[b.n,b.l[0]]],()=>startMatch(
  {n:b.n,col:b.col,hp:b.hp,atk:b.atk,boss:1,spd:1.06,aggr:cl(.5+ci*.04,0,.95),blk:.3+ci*.02,
   kind:b.kind||'scythe',fx:b.fx||'void',def:2+ci},
  c.th,{ci,best:3,title:'BOSS'},win=>{
   if(win){S.gold+=c.g;S.wins++;if(S.ch<=ci)S.ch=ci+1;unlockAll();save();
    scene(c.post.concat([['','Chapter complete.   +'+c.g+' gold']]),hub)}
   else defeat(()=>bossFight(ci),()=>hub())}))}
function defeat(retry,leave){const e=$('fend');
 $('feT').textContent='DEFEATED';
 $('feD').textContent=TIPS[(Math.random()*TIPS.length)|0];
 $('feR').innerHTML='<button class="btn gold" id="fr1">TRY AGAIN</button><button class="btn" id="fr2">ARMORY</button><button class="btn" id="fr3">LEAVE</button>';
 e.classList.add('on');
 $('fr1').onclick=()=>{e.classList.remove('on');retry()};
 $('fr2').onclick=()=>{e.classList.remove('on');M=null;openShop()};
 $('fr3').onclick=()=>{e.classList.remove('on');M=null;leave()}}
const TIPS=['Hold GUARD just as the blow lands to parry. A parry staggers them and fills your energy.',
 'Press STRIKE again right after a hit to chain into the second and third attack.',
 'Energy builds as you fight. At full, MAGIC ends rounds.',
 'Pull the stick away from your enemy to back off; push it up to leap over a low swing.',
 'The Academy gives permanent perks. Four lessons is a whole new weapon.',
 'Train in the Armory. Vitality keeps you alive longer than raw power.',
 'Your blade reaches further than your boot. Kick only when they are close.',
 'Jump, then press KICK for a diving attack that hits hard.',
 'You can jump out of the end of a swing to escape a counter.'];
/* ---- tower ---- */
function tower(n){const ths=Object.keys(TH),th=ths[n%ths.length],boss=n%5===4;
 const names=(EN[n%EN.length]||[['Shade','#aaa']]);const t=names[n%names.length];
 Music.prof(MP[n%MP.length]);
 startMatch({n:boss?'Tower Warden '+(n+1):t[0]+' · '+(n+1),col:boss?'#ff4d6d':t[1],
  hp:62+n*13,atk:5+n*.95,boss,spd:.95+n*.012,aggr:cl(.34+n*.03,0,.95),blk:cl(.16+n*.02,0,.55),
  kind:boss?'scythe':'sword',def:n*.5},th,{best:boss?3:1,title:'FLOOR '+(n+1)},win=>{
  const e=$('fend');
  if(win){S.tower=Math.max(S.tower,n+1);const g=26+n*5;S.gold+=g;save();
   $('feT').textContent='FLOOR '+(n+1)+' CLEARED';$('feD').textContent='+'+g+' gold.  Your wounds do not heal between floors of the Tower... but your purse does.';
   $('feR').innerHTML='<button class="btn gold" id="t1">NEXT FLOOR</button><button class="btn" id="t2">LEAVE</button>';
   e.classList.add('on');$('t1').onclick=()=>{e.classList.remove('on');tower(n+1)};$('t2').onclick=()=>{e.classList.remove('on');M=null;hub()}}
  else{$('feT').textContent='FELL ON FLOOR '+(n+1);$('feD').textContent='Best climb: '+S.tower+' floors.';
   $('feR').innerHTML='<button class="btn gold" id="t3">LEAVE</button>';e.classList.add('on');
   $('t3').onclick=()=>{e.classList.remove('on');M=null;hub()}}})}
/* ---- dojo ---- */
function dojo(){startMatch({n:'Training Shade',col:'#8a86b8',hp:9999,atk:4,spd:.9,aggr:.35,blk:.3},'veil',
 {title:'DOJO'},()=>hub());
 setTimeout(()=>{if(M)toast('Dojo: the shade never falls. Leave with GUARD + MAGIC together.')},1800)}
/* ---- hub ---- */
function hub(){M=null;unlockAll();show('hub');const s=stats();
 $('hN').textContent=S.name.toUpperCase();
 const nx=Math.min(S.ch,CH.length-1);
 $('hS').innerHTML='GOLD <b style="color:var(--g)">'+Math.round(S.gold)+'</b><br>'+
  'HP '+s.hp+' · PWR '+Math.round(s.pow)+' · DEF '+Math.round(s.def)+(s.crit?' · CRIT '+Math.round(s.crit*100)+'%':'')+'<br>'+
  W_(S.wi).n+'<br>'+
  'Chapter '+(nx+1)+' of '+CH.length+' · Tower '+S.tower+'<br>'+
  'Lessons '+Object.keys(S.done).length+'/'+LES.length+' · KOs '+S.ko;
 save()}
$('hStory').onclick=()=>playChapter(S.ch);
$('hTower').onclick=()=>tower(S.tower);
$('hShop').onclick=openShop;
$('hAcad').onclick=()=>{show('acad');acad()};
$('hDojo').onclick=dojo;
$('hMore').onclick=()=>{show('more');more()};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>hub());
/* ---- shop ---- */
let tab='w';
function openShop(){show('shop');shop()}
document.querySelectorAll('#shop .tabs .btn').forEach(b=>b.onclick=()=>{tab=b.dataset.t;Music.fx('ui');
 document.querySelectorAll('#shop .tabs .btn').forEach(x=>x.classList.toggle('sel',x===b));shop()});
function shop(){$('shG').textContent=Math.round(S.gold)+' GOLD';let h='';
 const C=(t,eq,btn)=>`<div class="card${eq?' eq':''}">${t}${btn}</div>`;
 if(tab==='w')for(const w of WEAP){const own=S.ownW.includes(w.id),eq=S.wi===w.id;
  h+=C(`<b>${w.n}</b><small>${w.d}</small><span>POWER ${w.atk}${w.magic?' <span class="tag">MAGIC</span>':''}</span>`,eq,
   own?`<button class="btn${eq?' cy':''}" data-a="ew:${w.id}">${eq?'EQUIPPED':'EQUIP'}</button>`:
   w.learn?`<small style="color:var(--c)">Locked · earn it in the Academy</small>`:
   `<button class="btn gold" data-a="bw:${w.id}">BUY ${w.cost}</button>`)}
 if(tab==='a')for(const a of ARM){const own=S.ownA.includes(a.id),eq=S.ai===a.id;
  h+=C(`<b>${a.n}</b><span>DEFENSE ${a.def}</span>`,eq,
   own?`<button class="btn${eq?' cy':''}" data-a="ea:${a.id}">${eq?'WORN':'WEAR'}</button>`:`<button class="btn gold" data-a="ba:${a.id}">BUY ${a.cost}</button>`)}
 if(tab==='u')for(const u of AURA){const own=S.ownU.includes(u.id),eq=S.au===u.id;
  h+=C(`<b>${u.n}</b><small>${u.d||'No aura.'}</small>`,eq,
   own?`<button class="btn${eq?' cy':''}" data-a="eu:${u.id}">${eq?'ACTIVE':'WEAR'}</button>`:
   u.learn?`<small style="color:var(--c)">Locked · Academy reward</small>`:`<button class="btn gold" data-a="bu:${u.id}">BUY ${u.cost}</button>`)}
 if(tab==='t')for(const[k,n,d]of[['pow','STRENGTH','+2 power'],['vit','VITALITY','+12 health'],['spd','AGILITY','+5% speed'],['en','FOCUS','energy builds faster']]){
  const lv=S.up[k]||0,c=110+lv*lv*44+lv*70;
  h+=C(`<b>${n}</b><small>${d}</small><span>LEVEL ${lv}</span>`,0,`<button class="btn gold" data-a="up:${k}:${c}">TRAIN ${c}</button>`)}
 $('shL').innerHTML=h}
$('shL').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;
 const[a,id,c]=b.dataset.a.split(':'),pay=p=>{if(S.gold<p){toast('Not enough gold');return 0}S.gold-=p;Music.fx('coin');return 1};
 if(a==='ew'){S.wi=id;Music.fx('ui')}if(a==='ea'){S.ai=id;Music.fx('ui')}if(a==='eu'){S.au=id;Music.fx('ui')}
 if(a==='bw'&&pay(W_(id).cost)){S.ownW.push(id);S.wi=id;toast('Acquired: '+W_(id).n)}
 if(a==='ba'&&pay(A_(id).cost)){S.ownA.push(id);S.ai=id;toast('Acquired: '+A_(id).n)}
 if(a==='bu'&&pay(U_(id).cost)){S.ownU.push(id);S.au=id;toast('Aura bound: '+U_(id).n)}
 if(a==='up'&&pay(+c)){S.up[id]=(S.up[id]||0)+1;toast('Trained')}
 save();shop()});

function acad(){acIn=0;let h='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px">';
 for(const t in TRK){const ls=LES.filter(l=>l.tr===t),dn=ls.filter(l=>S.done[l.id]).length;
  h+=`<div class="card"><b>${TRK[t][0]}</b><small>${TRK[t][1]}</small><span style="color:var(--c);font-size:11px">${dn}/${ls.length}</span>`+
   ls.map(l=>`<button class="btn${S.done[l.id]?' cy':''}" data-l="${l.id}" style="padding:7px 9px;font-size:12px;text-align:left">${S.done[l.id]?'✓ ':'· '}${l.t}</button>`).join('')+'</div>'}
 $('acB').innerHTML=h+'</div><p style="opacity:.55;font-size:12px;margin-top:10px">Read a lesson, answer its trial, keep the perk forever. Some unlock weapons and auras. Use what you learn only on systems you own or are allowed to test.</p>';
 $('acP').textContent=Object.keys(S.done).length+' / '+LES.length+' PERKS';$('acB').scrollTop=0}
function lesson(id){const l=LES.find(x=>x.id===id);if(!l)return;acIn=1;
 $('acB').innerHTML=`<small style="color:var(--c);letter-spacing:.2em">${TRK[l.tr][0]} · ${l.t.toUpperCase()}</small>${l.b}
 <hr style="border:0;border-top:1px solid #2e2458;margin:12px 0"><b style="color:var(--g)">TRIAL — ${l.q}</b>`+
 l.o.map((t,i)=>`<button class="btn opt" data-o="${i}" data-id="${id}">${t}</button>`).join('')+
 (S.done[id]?`<p style="color:#5ef08a">Perk held: <b>${l.p.n}</b> — ${l.p.d}</p>`:'');
 $('acB').scrollTop=0}

 const b=e.target.closest('[data-l]');if(b){Music.fx('ui');return lesson(b.dataset.l)}

 const l=LES.find(x=>x.id===o.dataset.id);if(!l||S.done[l.id])return;

  toast('PERK — '+l.p.n+' · '+l.p.d);
  $('acB').insertAdjacentHTML('beforeend',`<p style="color:#5ef08a;border-top:1px solid #2e2458;padding-top:8px"><b>Correct.</b> Perk earned: <b>${l.p.n}</b> — ${l.p.d}. +55 gold.</p>`)}
 else{o.classList.add('no');setTimeout(()=>o.classList.remove('no'),900);toast('Not quite — read it again')}});

 $('moB').innerHTML=`<h3>SETTINGS</h3>
 <button class="btn" data-s="mus">MUSIC: ${S.mus?'ON':'OFF'}</button>
 <button class="btn" data-s="sfx">SOUND: ${S.sfx?'ON':'OFF'}</button>
 <button class="btn" data-s="shake">SCREEN SHAKE: ${S.shake?'ON':'OFF'}</button>
 <button class="btn cy" data-s="cons">OPEN CONSOLE</button>
 <h3 style="margin-top:14px">HOW TO FIGHT</h3>
 <p>Left stick moves. Pull it <b>away</b> from your enemy to guard. Push it <b>up</b> to leap.<br>
 <b>STRIKE</b> twice more right after a hit chains a three-part combo. <b>KICK</b> reaches further.<br>
 <b>GUARD</b> the instant a blow lands is a <b>parry</b>: no damage, they stagger, your energy jumps.<br>
 <b>MAGIC</b> needs full energy. <b>CYBER</b> needs 55 and grows stronger with every lesson you pass (now ${(1+done*.085).toFixed(2)}×).</p>
 <h3 style="margin-top:14px">CODEX</h3>
 <p style="opacity:.8">${CH.slice(0,Math.max(1,S.ch)).map(c=>'<b style="color:var(--g)">'+c.t+'</b> — '+fill(c.sc[0][1]).slice(0,150)+'…').join('<br><br>')}</p>
 <h3 style="margin-top:14px">SAVE</h3>
 <p style="opacity:.7">Progress is kept on this device only. ${S.wins} chapters cleared, ${S.ko} knockouts.</p>
 <button class="btn" data-s="wipe" style="border-color:#803">ERASE EVERYTHING</button>`}
$('moB').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;const k=b.dataset.s;Music.fx('ui');
 if(k==='mus')Music.toggle();
 if(k==='sfx'){S.sfx=S.sfx?0:1;save()}
 if(k==='shake'){S.shake=S.shake?0:1;save()}
 if(k==='cons'){show('cons');return}
 if(k==='wipe'){if(confirm('Erase all progress?')){localStorage.removeItem(KEY);location.reload()}return}
 more()});

<script>
/* ============ CONSOLE ============ */
const g={
 give:n=>{S.gold+=(+n||0);save();return'gold = '+Math.round(S.gold)},
 god:v=>{if(M){M.P.mhp=M.P.hp=(v===false?stats().hp:99999)}return'god'},
 heal:()=>{if(M)M.P.hp=M.P.mhp;return'healed'},
 energy:()=>{if(M)M.P.en=100;return'full'},
 kill:()=>{if(M)M.E.hp=0;return'down'},
 win:()=>{if(M){M.E.hp=0}return'ok'},
 power:n=>{if(M)M.P.pow=+n;return'power '+n},
 slowmo:v=>{SLOW=+v||1.5;return'slow'},
 train:(k,n)=>{S.up[k]=+n;save();return JSON.stringify(S.up)},
 unlockAll:()=>{S.ownW=WEAP.map(w=>w.id);S.ownA=ARM.map(a=>a.id);S.ownU=AURA.map(a=>a.id);save();return'all gear unlocked'},
 learnAll:()=>{LES.forEach(l=>S.done[l.id]=1);unlockAll();save();return'all lessons marked (you still learn nothing by skipping them)'},
 setChapter:n=>{S.ch=cl(+n,0,CH.length-1);save();return'chapter '+(S.ch+1)},
 setTower:n=>{S.tower=+n;save();return'floor '+n},
 equip:(w,a,u)=>{if(w)S.wi=w;if(a)S.ai=a;if(u)S.au=u;save();return W_(S.wi).n},
 stats:()=>JSON.stringify(stats(),null,1),
 list:()=>'weapons: '+WEAP.map(w=>w.id).join(' ')+'\narmor: '+ARM.map(a=>a.id).join(' ')+'\nauras: '+AURA.map(a=>a.id).join(' ')+'\nlessons: '+LES.map(l=>l.id).join(' '),
 addWeapon:o=>{const w=Object.assign({id:'x'+WEAP.length,n:'Custom Blade',atk:14,cost:0,col:'#ffffff',kind:'sword',fx:'slash',d:'Forged in the console.'},o);
  WEAP.push(w);if(!S.ownW.includes(w.id))S.ownW.push(w.id);save();return'added '+w.id},
 addAura:o=>{const u=Object.assign({id:'xu'+AURA.length,n:'Custom Aura',col:'#ffffff',b:{pow:2},cost:0,d:''},o);AURA.push(u);S.ownU.push(u.id);save();return u.id},
 addChapter:o=>{CH.push(Object.assign({t:'Extra Chapter',th:'veil',r:2,mp:MP[0],en:[['Stranger','#fff']],
  sc:[['','...']],b:{n:'Nameless',hp:320,atk:14,col:'#ff4d6d',l:['...']},post:[],g:300},o));return'chapters: '+CH.length},
 addLesson:o=>{LES.push(o);return'lessons: '+LES.length},
 spawn:o=>{startMatch(Object.assign({n:'Summoned',col:'#ff4d6d',hp:300,atk:12,spd:1,aggr:.6},o),'veil',{},()=>hub());return'fight'},
 fight:()=>M,save,S,CH,LES,WEAP,AURA,ARM,
 help:()=>$('cDoc').click()};
window.game=g;window.g=g;
function runCode(code){const out=$('cOut'),log=[];
 let expr=null;try{expr=new Function('g','game','S','M','CH','LES','console','return ('+code+')')}catch(e){}
